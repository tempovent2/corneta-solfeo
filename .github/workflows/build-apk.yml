
name: Build APK

on:
  # Se ejecuta cuando haces push a main o cuando lo lanzas manualmente
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout del código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 🏗️ Generar estructura Android
        run: flutter create --platforms=android --org com.tempovent2 --project-name corneta_solfeo .

      - name: 🛠️ Actualizar complemento Kotlin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("android/settings.gradle")
          content = file.read_text()

          pattern = r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])'

          updated, count = re.subn(
              pattern,
              r'\g<1>2.0.21\g<2>',
              content
          )

          if count != 1:
              raise SystemExit("No se pudo identificar la version de Kotlin en settings.gradle")

          file.write_text(updated)
          print("Kotlin actualizado a 2.0.21")
          PY

      - name: 📦 Obtener dependencias
        run: flutter pub get

      - name: 🔍 Analizar código (opcional)
        run: flutter analyze --no-fatal-infos || true

      - name: 🏗️ Compilar APK (release)
        run: flutter build apk --release

      - name: 📤 Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: corneta-solfeo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
