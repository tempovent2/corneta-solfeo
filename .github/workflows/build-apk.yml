
name: Build APK

on:
  # Se ejecuta cuando haces push a main o cuando lo lanzas manualmente
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout del código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 🏗️ Generar estructura Android
        run: flutter create --platforms=android --org com.tempovent2 --project-name corneta_solfeo .

      - name: 🛠️ Actualizar versiones de Gradle y Kotlin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle")
          if not settings.exists():
              settings = Path("android/settings.gradle.kts")

          if not settings.exists():
              raise SystemExit("No se encontró settings.gradle")

          content = settings.read_text()

          updates = [
              (
                  r'(id\s*\(?\s*["\']com\.android\.application["\']\s*\)?\s+version\s+["\'])[^"\']+(["\'])',
                  "8.6.1",
                  "Android Gradle Plugin"
              ),
              (
                  r'(id\s*\(?\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)?\s+version\s+["\'])[^"\']+(["\'])',
                  "2.0.21",
                  "Kotlin"
              )
          ]

          for pattern, version, name in updates:
              content, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + version + m.group(2),
                  content
              )
              if count != 1:
                  raise SystemExit(f"No se pudo actualizar {name}: coincidencias {count}")
              print(f"{name} actualizado a {version}")

          settings.write_text(content)

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not wrapper.exists():
              raise SystemExit("No se encontró gradle-wrapper.properties")

          content = wrapper.read_text()
          updated, count = re.subn(
              r'gradle-[0-9.]+-(?:all|bin)\.zip',
              'gradle-8.7-all.zip',
              content
          )

          if count != 1:
              raise SystemExit("No se pudo actualizar Gradle Wrapper")

          wrapper.write_text(updated)
          print("Gradle Wrapper actualizado a 8.7")
          PY

      - name: 📦 Obtener dependencias
        run: flutter pub get

      - name: 🔍 Analizar código (opcional)
        run: flutter analyze --no-fatal-infos || true

      - name: 🏗️ Compilar APK (release)
        run: flutter build apk --release

      - name: 📤 Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: corneta-solfeo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
